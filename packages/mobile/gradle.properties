org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 split the Android plugins: 'com.android.application' is no longer
# compatible with 'org.jetbrains.kotlin.multiplatform' unless the new DSL and
# built-in Kotlin are disabled. We keep the KMP module shape and bypass it here;
# a later change can migrate the shared core to
# 'com.android.kotlin.multiplatform.library'.
android.builtInKotlin=false
android.newDsl=false
