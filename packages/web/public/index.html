<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ldmux" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>ldmux</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="menu" aria-label="Sessions">☰</button>
        <span id="title">ldmux</span>
        <span id="status" class="off">offline</span>
        <button id="history" aria-label="Load older scrollback" class="hidden">⤒</button>
        <button id="keys-toggle" aria-label="Toggle extra keys">⌨</button>
      </header>

      <main id="screen">
        <div id="term-wrap"><div id="term"></div></div>
        <div id="empty">No session attached — open ☰ and pick one.</div>
        <button id="jump" class="hidden" aria-label="Jump to bottom">↓</button>
        <div id="swipe-left" class="edge" aria-hidden="true"></div>
        <div id="swipe-right" class="edge" aria-hidden="true"></div>
      </main>

      <div id="keybar" class="hidden"></div>

      <aside id="drawer" class="hidden">
        <div id="drawer-head">
          <span>Sessions</span>
          <button id="refresh" aria-label="Refresh">⟳</button>
        </div>
        <ul id="sessions"></ul>
      </aside>

      <div id="token-overlay" class="hidden">
        <form id="token-form">
          <h1>ldmux</h1>
          <p>Paste the pairing token shown by <code>just cli remote</code>.</p>
          <input id="token-input" type="text" autocomplete="off" spellcheck="false" placeholder="token" />
          <button type="submit">Connect</button>
        </form>
      </div>
    </div>

    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script src="/core.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
