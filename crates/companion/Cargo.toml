[package]
name = "ldmux-companion"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The host's own MeshCore companion radio over USB serial: framing, the two identity commands, raw sends, and the receive log. No gateway, no second runtime."

[dependencies]
nix = { version = "0.29", features = ["term", "fs", "ioctl", "poll"] }
# ADR-0033: a flood scope is proved per packet with HMAC-SHA-256 over the payload, and a region's
# key is SHA-256 of its name — the firmware's own two operations (`TransportKeyStore.cpp:4-25`,
# `:52-63`). Pure Rust (RustCrypto), the same crates `ldmux-session` already uses for the
# handshake tag; no C, no `ring`.
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["io-util", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints]
workspace = true
