[package]
name = "ldmux-protocol"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The ldmux wire contract: frames, messages, keeper, rpc, pairing, net, paths, socket"

[features]
# Host-only I/O: the Unix socket pair (`socket`), the keeper call, and path resolution, all of
# which need a filesystem and a uid. `ldmux-session-ffi` builds this crate with
# `default-features = false` for Android, where none of those exist and `tokio`/`nix` must not be
# linked at all — see `docs/RADIO-PLAN.md` §8.1. The wire itself (`frames`, `messages`, `rpc`,
# `keeper`, `mesh_term`, `pairing`, `net`, `utf8`, `base64`) is unconditional.
default = ["host-ipc"]
host-ipc = ["dep:tokio", "dep:nix"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"], optional = true }
nix = { version = "0.29", features = ["user", "fs"], optional = true }
uuid = { version = "1", features = ["v4"] }
# A compressed screen frame (ADR-0019's dependency, already in the tree for permessage-deflate).
#
# `zlib-rs`, not `rust_backend`: a frame may be deflated against a preset dictionary
# (`FRAME_DICTIONARY`), and flate2 exposes `set_dictionary` only for the zlib-rs and C backends.
# zlib-rs is a pure-Rust zlib — no C, which is what the dependency rule cares about — and the
# dictionary is what takes a full screen from 419 bytes to 325, i.e. from three records to two.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints]
workspace = true

# The fixture the mobile port is checked against carries the L2 record limits, so the
# constants the radio layer enforces and the ones the port mirrors cannot drift apart
# without a failed test on both sides.
[dev-dependencies]
ldmux-mesh = { path = "../mesh" }
