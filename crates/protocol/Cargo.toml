[package]
name = "ldmux-protocol"
version = "0.1.0"
edition = "2024"
description = "The ldmux wire contract: frames, messages, keeper, rpc, pairing, net, paths, socket"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }
