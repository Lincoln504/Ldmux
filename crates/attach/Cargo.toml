[package]
name = "ldmux-attach"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "attach"
path = "src/lib.rs"

[[bin]]
name = "ldmux-attach"
path = "src/main.rs"

[dependencies]
ldmux-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["net", "io-util", "io-std", "time", "rt", "rt-multi-thread", "macros", "signal"] }
nix = { version = "0.29", features = ["term", "signal", "poll"] }
serde = "1"
serde_json = "1"
tokio-tungstenite = "0.26"
futures-util = "0.3"

[dev-dependencies]
ldmux-keeper = { path = "../keeper" }

[lints]
workspace = true
