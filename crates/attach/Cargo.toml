[package]
name = "ldmux-attach"
version = "0.1.0"
edition = "2024"

[lib]
name = "attach"
path = "src/lib.rs"

[[bin]]
name = "ldmux-attach"
path = "src/main.rs"

[dependencies]
ldmux-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["net", "io-util", "time", "rt", "macros"] }
nix = { version = "0.29", features = ["term"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
ldmux-keeper = { path = "../keeper" }
