[package]
name = "ldmux-keeper"
version = "0.1.0"
edition = "2024"
description = "The ldmux keeper: allocates PTYs, owns the shell pids, supervises them, and serves the keeper protocol over a Unix socket (plan §3)"
license = "MIT"

[lib]
name = "keeper"
path = "src/lib.rs"

[[bin]]
name = "ldmux-keeper"
path = "src/main.rs"

[dependencies]
ldmux-protocol = { path = "../protocol" }
ldmux-vt-sys = { path = "../vt-sys" }
nix = { version = "0.29", features = ["term", "process", "signal", "user"] }
tokio = { version = "1", features = ["net", "io-util", "time", "process", "rt", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
