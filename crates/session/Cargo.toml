[package]
name = "ldmux-session"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The L3 end-to-end session over the mesh link: Noise IKpsk2, the record layout, and ARQ. Pure: no I/O, no radio knowledge (ADR-0020, ADR-0023)."

[dependencies]
ldmux-mesh = { path = "../mesh" }
# The terminal protocol, for [`crate::client`] — the phone's side of the radio route. This used to be
# a test-only dependency, on the reasoning that the session layer should not learn what it carries.
# The client engine is the exception that reasoning did not anticipate: it is the value the app
# holds, so it speaks the protocol the app speaks, and giving it a home in this crate is what stops
# the phone reimplementing the protocol in Kotlin (`docs/RADIO-PLAN.md` §8.1, `A2`).
#
# `default-features = false` is load-bearing: it is the half of `ldmux-protocol` that owns no
# `tokio`, no `nix` and no Unix socket, so this crate stays hour-pure and still links into
# `libldmux_session.so`. The host's half stays out of the phone's library.
ldmux-protocol = { path = "../protocol", default-features = false }
# ADR-0023: the Noise implementation, without its `std` feature so that the C-backed `ring`
# resolver is not pulled in. Only the RustCrypto resolver pieces the suite needs.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
# The handshake filter tag (ADR-0020 section 2) is HMAC-SHA-256 and nothing new.
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
# The simulated mesh, for the tests that must produce a repeater's echo rather than assert about a
# record this file built. `sim` is off in the shipped dependency: a radio-facing build has no
# simulator in it.
ldmux-mesh = { path = "../mesh", features = ["sim"] }

[lints]
workspace = true
