[package]
name = "ldmux-session"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The L3 end-to-end session over the mesh link: Noise IKpsk2, the record layout, and ARQ. Pure: no I/O, no radio knowledge (ADR-0020, ADR-0023)."

[dependencies]
ldmux-mesh = { path = "../mesh" }
# ADR-0023: the Noise implementation, without its `std` feature so that the C-backed `ring`
# resolver is not pulled in. Only the RustCrypto resolver pieces the suite needs.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
# The handshake filter tag (ADR-0020 section 2) is HMAC-SHA-256 and nothing new.
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"
# The `payload_fits` proof: the wire's own limits must fit inside this crate's transport, and the
# two live in crates that deliberately cannot see each other. A test dependency, never a runtime one
# -- `ldmux-session` must not learn the terminal protocol, and `ldmux-protocol` must not learn the
# session.
ldmux-protocol = { path = "../protocol" }
# The simulated mesh, for the tests that must produce a repeater's echo rather than assert about a
# record this file built. `sim` is off in the shipped dependency: a radio-facing build has no
# simulator in it.
ldmux-mesh = { path = "../mesh", features = ["sim"] }

[lints]
workspace = true
