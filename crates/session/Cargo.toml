[package]
name = "ldmux-session"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The L3 end-to-end session over the mesh link: Noise IKpsk2, the record layout, and ARQ. Pure: no I/O, no radio knowledge (ADR-0020, ADR-0021)."

[dependencies]
ldmux-mesh = { path = "../mesh" }
# ADR-0021: the Noise implementation, without its `std` feature so that the C-backed `ring`
# resolver is not pulled in. Only the RustCrypto resolver pieces the suite needs.
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
# The handshake filter tag (ADR-0020 section 2) is HMAC-SHA-256 and nothing new.
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
