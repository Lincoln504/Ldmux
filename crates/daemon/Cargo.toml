[package]
name = "ldmux-daemon"
version = "0.1.0"
edition = "2024"
description = "The ldmux daemon proper: registry, ownership, remote WS, streams, desktop, CLI (and the pure modules the daemon is built from)"
license = "MIT"

[dependencies]
ldmux-protocol = { path = "../protocol" }
ldmux-vt-sys = { path = "../vt-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
rand = { version = "0.9", features = ["std"] }
nix = { version = "0.29", features = ["process", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# The §3.11 parity harness (tests/parity.rs) drives the engine directly, so the
# crate under test's engine dep is also a dev-dep (tests/ is a separate crate
# that sees the crate under test + its dev-deps, not its plain deps).
ldmux-vt-sys = { path = "../vt-sys" }
