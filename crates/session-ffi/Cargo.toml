[package]
name = "ldmux-session-ffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The C ABI over ldmux-session, for the phone (JNI today, Swift later). The only crate in the L3 stack that contains unsafe."

[lib]
name = "ldmux_session_ffi"
# staticlib: linked into the JNI shim by packages/mobile/native/build-session.sh.
# rlib: so this crate's own tests can call the ABI like C would.
crate-type = ["staticlib", "rlib"]

[dependencies]
ldmux-session = { path = "../session" }
ldmux-mesh = { path = "../mesh" }
# The terminal protocol, for the client engine's messages and the events it hands back. **With no
# default features**: this is the half of `ldmux-protocol` that owns no `tokio`, no `nix` and no
# Unix socket, which is what keeps this library linkable into Android (`docs/RADIO-PLAN.md` §8.1).
ldmux-protocol = { path = "../protocol", default-features = false }

[lints]
workspace = true
