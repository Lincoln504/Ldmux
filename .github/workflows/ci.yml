name: ci

on:
  # Every branch, not just main. The workflow ran only on main and on pull requests, so a
  # long-lived feature branch accumulated two broken steps (a stale flake path and a
  # rejected flag) that nothing was watching, and both were invisible until release.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned by full commit SHA (verified against the upstream
      # tag with `git ls-remote`): actions/checkout v7.0.1,
      # cachix/install-nix-action v31.9.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@2126ae7fc54c9df00dd18f7f18754393182c73cd
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: clippy (warnings are errors)
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      # The desktop tests start their own Xvfb when it is on PATH (the flake
      # devShell provides xorgserver); no xvfb-run wrapper is needed.
      #
      # One process per test binary, in a pool: the same binaries `cargo test
      # --workspace` runs, which runs them one at a time and takes four times as
      # long. The script exits non-zero on any failure and prints its output.
      - name: test
        run: nix develop --command python3 scripts/test-parallel.py --locked
      - name: cargo deny
        run: nix develop --command cargo deny check
