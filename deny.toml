# cargo-deny policy. Run: cargo deny check
#
# AGENTS.md pins a direct-dependency allowlist (tokio, tokio-tungstenite,
# serde, serde_json, futures-util, uuid, nix, rand, flate2). cargo-deny's
# `bans.allow` would have to enumerate every transitive crate too, so the
# allowlist itself is enforced in review; here we ban the crates that would
# most plausibly sneak in against it (TLS stacks and HTTP clients; the daemon
# is tailnet-only and never terminates TLS).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Only licences actually present in the lockfile (checked with `cargo deny list`);
# dual-licensed crates are satisfied by any one listed alternative.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "reqwest" },
    { crate = "hyper" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
